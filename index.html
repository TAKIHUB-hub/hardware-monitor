<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        a {
            color: hsl(90, 25%, 98%) !important;
            text-decoration: none;
        }
    </style>

    <meta charset="utf-8"/>
    <title>Hardware Info - Ultimate Edition</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0c0c0c;
            color: white;
            font-family: 'Inter', 'Roboto', 'Arial', sans-serif;
        }

        .tech-heading {
            font-weight: bold; 
            color: #fcfcfd; 
            font-size: 2.5rem; 
            margin-top: 20px;   
            text-align: center; 
            direction: ltr; 
            text-shadow: 
                -1px -1px 2px #0c0c0c,  
                 1px  1px 2px #000000;   
            cursor: pointer;
        }

        summary {
            list-style: none;
        }
        summary::-webkit-details-marker {
            display: none;
        }

        .box-compare {
            border: 2px solid #7f51eb;
            border-radius: 8px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            width: 280px;
            text-align: center;
        }

        .box-compare input {
            width: 90%;
            padding: 8px 10px;
            margin-top: 10px;
            border-radius: 4px;
            border: 1px solid #7f51eb;
            background-color: #1a1a1a;
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            outline: none;
        }

        .compare-btn {
            display: block;
            width: 630px;
            margin: 20px auto 10px auto;
            padding: 12px;
            background-color: #7f51eb;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }

        .compare-btn:hover {
            background-color: #693bc2;
        }

        /* Styling for the comparison result box */
        .result-container {
            display: none; 
            width: 630px;
            margin: 20px auto;
            background-color: #121212;
            border: 2px solid #7f51eb;
            border-radius: 8px;
            padding: 20px;
            color: #ffffff;
            text-align: center;
            animation: fadeIn 0.4s ease-in-out;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .score-display {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 18px;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 6px;
        }

        .score-display div {
            width: 45%;
        }

        .verdict {
            font-size: 22px;
            font-weight: bold;
            color: #7f51eb;
            background-color: rgba(127, 81, 235, 0.1);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #7f51eb;
        }
    </style>
</head>

    const cpuDatalist = document.getElementById('all-cpus-list');

        let option = document.createElement('option');
        option.value = item;
        
        // Basic filter: If it has Core, Ryzen, or Threadripper, it's a CPU. Else, GPU.

        } else {
            gpuDatalist.appendChild(option);
        }
    });

            const item2Name = inputs[1].value.trim();

                return;

            const score2 = hardwareScores[item2Name];

                </div>
